name: Fetch universe

# Pulls the full training universe and retrains the state classifier.
# Weekly — the deep history rarely changes and this is the expensive job.
#
# NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity.
# This job commits on every run, which counts as activity and keeps it alive.

on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs of this job overlap — that is what causes push rejections.
concurrency:
  group: fetch-universe
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch price history
        run: python scripts/fetch_universe.py --config config/universe.yml --out data/

      - name: Retrain state classifier
        run: python scripts/train_states.py --data data/ --out data/state_evidence.json

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "universe refresh $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, retrying ($i/3)"
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
