name: Fetch universe

# Pulls the full training universe. Runs weekly — the deep history rarely changes,
# and this is the expensive job.
#
# NOTE ON THE 60-DAY RULE: GitHub disables scheduled workflows after 60 days of
# repository inactivity. This job commits data on every run, which counts as
# activity, so the schedule keeps itself alive.

on:
  schedule:
    - cron: '0 6 * * 6'        # Saturdays 06:00 UTC
  workflow_dispatch:            # and on demand

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch price history
        run: python scripts/fetch_universe.py --config config/universe.yml --out data/

      - name: Retrain state classifier
        run: python scripts/train_states.py --data data/ --out data/state_evidence.json

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "universe refresh $(date -u +%Y-%m-%d)"
          git push
