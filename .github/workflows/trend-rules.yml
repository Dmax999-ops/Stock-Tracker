name: Daily trend rules

# The rules you can see on a daily chart -- 50/200 cross, price vs the 200-day,
# Donchian breakouts, horizontal level breaks, trendline breaks -- run on DAILY
# candles for the actual holdings, priced in pounds against buy-and-hold.
#
# Plus the relative-strength arm: always invested, rotating into the strongest
# names rather than into cash.

on:
  workflow_dispatch:
    inputs:
      extra:
        description: 'Extra tickers, comma separated'
        required: false
        default: 'MSFT,AAPL,NVDA,SPY,QQQ'
      window:
        description: 'Second reporting window start (your chart period)'
        required: false
        default: '2019-01-01'

permissions:
  contents: write

concurrency:
  group: trend-rules
  cancel-in-progress: false

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the rules on daily candles
        if: always()
        run: |
          python scripts/trend_rules.py \
            --holdings config/holdings.yml \
            --extra "${{ github.event.inputs.extra || 'MSFT,AAPL,NVDA,SPY,QQQ' }}" \
            --start 2014-01-01 \
            --window "${{ github.event.inputs.window || '2019-01-01' }}" \
            --out data/trend_evidence.json

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "daily trend rules $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main || git rebase --abort || true
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, retrying ($i/3)"
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
