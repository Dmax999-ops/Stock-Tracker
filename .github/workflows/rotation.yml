name: Rotation

# Buy-and-hold with the dying stocks taken out. Money from a sold stock goes
# into the stocks currently in healthy trends -- always invested, never in the
# failing ones -- instead of sitting in cash at 0%.
#
# Benchmark: equal weight in every live stock, rebalanced on the same calendar
# (the index-fund version of buy-and-hold). To pass, an arm must beat it by 1%
# a year AND on Calmar, in BOTH 1996-2012 and 2013-2026. Calibration runs first.

on:
  workflow_dispatch:
    inputs:
      calibrate:
        description: 'Random-walk panels for the false-positive check (0 to skip)'
        required: false
        default: '6'
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write

concurrency:
  group: rotation
  cancel-in-progress: false

jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild price panel if absent
        run: |
          if [ ! -f data/prices.parquet ]; then
            python scripts/fetch_universe.py --config config/universe.yml --out data/
          fi

      - name: Calibrate against random walks
        if: ${{ github.event.inputs.calibrate != '0' }}
        run: |
          python scripts/rotation.py \
            --calibrate ${{ github.event.inputs.calibrate || 6 }} \
            --out data/rotation_calibration.json

      - name: Run rotation on the full universe
        if: always()
        run: |
          python scripts/rotation.py \
            --prices data/prices.parquet \
            --out data/rotation_evidence.json

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then echo "no changes to commit"; exit 0; fi
          git commit -m "rotation $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main || git rebase --abort || true
            if git push origin HEAD:main; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected, retrying ($i/3)"; sleep 5
          done
          echo "could not push after 3 attempts"; exit 1
