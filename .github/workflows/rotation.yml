name: ETF rotation

# Trend rules where professionals actually use them: the S&P 500, the nine
# sector funds, international equity and Treasuries. Clean data -- no
# survivorship, no index look-ahead, no recycled tickers -- and every
# instrument can actually be bought.
#
# When the equity trend breaks, money goes to Treasuries, not idle cash.
# A walk-forward arm re-picks its own rule every January using only past data.
#
# To pass: beat the S&P 500 by 1% a year, on Calmar, AND with an excess-return
# t above 2, in 1999-2012 AND from 2013. Calibration runs first.

on:
  workflow_dispatch:
    inputs:
      calibrate:
        description: 'Random-walk panels for the false-positive check (0 to skip)'
        required: false
        default: '12'
  schedule:
    - cron: '0 22 * * 1-5'     # every weekday after the US close

permissions:
  contents: write

concurrency:
  group: etf-rotation
  cancel-in-progress: false

jobs:
  etf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Calibrate against random walks
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.calibrate != '0' }}
        run: |
          python scripts/etf_rotation.py \
            --calibrate ${{ github.event.inputs.calibrate || 12 }} \
            --out data/etf_rotation_calibration.json

      - name: Run on real ETF history
        if: always()
        run: |
          python scripts/etf_rotation.py --out data/etf_rotation_evidence.json

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ docs/
          if git diff --staged --quiet; then echo "no changes to commit"; exit 0; fi
          git commit -m "etf rotation $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main || git rebase --abort || true
            if git push origin HEAD:main; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected, retrying ($i/3)"; sleep 5
          done
          echo "could not push after 3 attempts"; exit 1
