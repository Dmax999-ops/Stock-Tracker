name: Daily plan

# Two outputs every weekday, after the US close:
#   1. BUY / HOLD / SELL for every stock in config/holdings.yml
#   2. the GBP 10,000 model portfolio from the Russell 1000 (S&P 500 fallback),
#      with themes (e.g. AI) found from how stocks trade together
# Written to docs/PLAN.md (readable on GitHub) and docs/plan.json.

on:
  schedule:
    - cron: '15 22 * * 1-5'     # 22:15 UTC, after the US close all year round
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      # emails are sent only once these three repository secrets exist
      MAIL_ON: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_PASSWORD != '' && secrets.MAIL_TO != '' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt requests lxml pyyaml

      - name: Build today's plan
        env:
          STRATEGY_POT: ${{ vars.STRATEGY_POT || '10000' }}
        run: python scripts/daily_plan.py

      - name: Commit
        if: always()
        run: |
          bash scripts/commit_push.sh "daily plan $(date -u +%Y-%m-%d)" \
            docs/PLAN.md docs/plan.json docs/plan_state.json docs/plan_error.json \
            data/live_prices.csv data/strategy_log.jsonl data/paper_test.csv

      - name: Prepare email subjects
        id: subj
        if: always()
        run: |
          echo "today=$(date -u +'%a %d %b %Y')" >> "$GITHUB_OUTPUT"
          if [ -f docs/ACTION.md ]; then
            echo "action=$(head -n 1 docs/ACTION.md | cut -c1-150)" >> "$GITHUB_OUTPUT"
            tail -n +3 docs/ACTION.md > docs/ACTION_BODY.md
          fi

      - name: Email - ACTION NEEDED (only when there is something to do)
        if: always() && env.MAIL_ON == 'true' && hashFiles('docs/ACTION.md') != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.subj.outputs.action }}
          to: ${{ secrets.MAIL_TO }}
          from: Stock Tracker <${{ secrets.MAIL_USERNAME }}>
          body: file://docs/ACTION_BODY.md
          convert_markdown: true

      - name: Email - daily summary
        if: always() && env.MAIL_ON == 'true' && hashFiles('docs/EMAIL.md') != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Daily plan - ${{ steps.subj.outputs.today }}
          to: ${{ secrets.MAIL_TO }}
          from: Stock Tracker <${{ secrets.MAIL_USERNAME }}>
          body: file://docs/EMAIL.md
          convert_markdown: true
