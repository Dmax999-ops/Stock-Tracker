name: Daily plan

# Two outputs every weekday, after the US close:
#   1. BUY / HOLD / SELL for every stock in config/holdings.yml
#   2. the GBP 10,000 model portfolio from the Russell 1000 (S&P 500 fallback),
#      with themes (e.g. AI) found from how stocks trade together
# Written to docs/PLAN.md (readable on GitHub) and docs/plan.json.

on:
  schedule:
    - cron: '15 22 * * 1-5'     # 22:15 UTC, after the US close all year round
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt requests lxml pyyaml

      - name: Build today's plan
        run: python scripts/daily_plan.py

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/ data/
          if git diff --staged --quiet; then echo "no changes to commit"; exit 0; fi
          git commit -m "daily plan $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main || git rebase --abort || true
            if git push origin HEAD:main; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected, retrying ($i/3)"; sleep 5
          done
          echo "could not push after 3 attempts"; exit 1
