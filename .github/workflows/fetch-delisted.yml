name: Fetch delisted

# Builds the survivorship-free archive, 20 tickers at a time.
#
# 625 companies left the S&P 500 since 1996. Yahoo serves 115 of them. Alpha
# Vantage serves most of the rest, but the free tier allows 25 calls a day — so
# this job takes a bite each morning and remembers where it got to in
# data/delisted/_worklist.json. The archive completes itself in ~3 weeks.
#
# Needs one repository secret: ALPHAVANTAGE_API_KEY.
# Without it the script exits cleanly and does nothing.

on:
  schedule:
    # The archive is complete (all 625 companies tried, Nov 2026). From now on a
    # weekly top-up is enough: it picks up companies that newly leave the S&P 500
    # and retries the odd Alpha Vantage error. Sundays, when nothing else runs.
    - cron: '30 7 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-delisted
  cancel-in-progress: false

jobs:
  delisted:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch next batch of delisted tickers
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          python scripts/fetch_delisted.py \
            --config config/universe.yml \
            --out data/delisted \
            --limit 20

      # The register of WHO failed and WHEN, from the filings themselves.
      # Free, complete, and the thing that lets a backtest close dead positions
      # honestly instead of silently deleting them.
      - name: Build the delisting register from EDGAR
        if: always()
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          python scripts/fetch_delistings.py \
            --config config/universe.yml \
            --out data \
            --limit 400

      - name: Commit
        if: always()
        run: |
          bash scripts/commit_push.sh "delisted archive $(date -u +%Y-%m-%d)" \
            data/delisted data/delisting_register.csv data/delistings.csv data/delistings_manifest.json
