name: Fetch delisted

# Builds the survivorship-free archive, 20 tickers at a time.
#
# 625 companies left the S&P 500 since 1996. Yahoo serves 115 of them. Alpha
# Vantage serves most of the rest, but the free tier allows 25 calls a day — so
# this job takes a bite each morning and remembers where it got to in
# data/delisted/_worklist.json. The archive completes itself in ~3 weeks.
#
# Needs one repository secret: ALPHAVANTAGE_API_KEY.
# Without it the script exits cleanly and does nothing.

on:
  schedule:
    # The Alpha Vantage price archive is capped at 25 calls a day, so it takes
    # its bite each morning and no more.
    - cron: '30 7 * * *'
    # The EDGAR register has NO daily cap — only a 10 requests/second courtesy
    # limit — so throttling it to one run a day was my mistake, not the API's.
    # Every four hours it finishes the whole register inside a day and then
    # becomes a no-op, because the script skips tickers already done.
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-delisted
  cancel-in-progress: false

jobs:
  delisted:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Only on the daily firing: the free tier allows 25 calls a day, so
      # running this every four hours would just collect rate-limit errors.
      - name: Fetch next batch of delisted tickers
        if: github.event.schedule != '0 */4 * * *'
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          python scripts/fetch_delisted.py \
            --config config/universe.yml \
            --out data/delisted \
            --limit 20

      # The register of WHO failed and WHEN, from the filings themselves.
      # Free, complete, and the thing that lets a backtest close dead positions
      # honestly instead of silently deleting them.
      - name: Build the delisting register from EDGAR
        if: always()
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          python scripts/fetch_delistings.py \
            --config config/universe.yml \
            --out data \
            --limit 400

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "delisted archive $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main || git rebase --abort || true
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, retrying ($i/3)"
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
