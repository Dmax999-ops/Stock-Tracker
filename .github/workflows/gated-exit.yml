name: Gated exit

# A trend filter is insurance: it charges a premium on the winners and pays out
# on the losers. This tests whether the premium can be stopped without losing
# the payout -- by refusing to sell a stock that still shows positive momentum.
#
# The calibration job runs first. If the procedure fires on random walks,
# nothing the real run says is worth reading.

on:
  workflow_dispatch:
    inputs:
      calibrate:
        description: 'Random-walk panels for the false-positive check (0 to skip)'
        required: false
        default: '10'
  schedule:
    - cron: '0 6 * * 1'          # Mondays, after the register has filled

permissions:
  contents: write

concurrency:
  group: gated-exit
  cancel-in-progress: false

jobs:
  gated:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild price panel if absent
        run: |
          if [ ! -f data/prices.parquet ]; then
            python scripts/fetch_universe.py --config config/universe.yml --out data/
          fi

      - name: Calibrate against random walks
        if: ${{ github.event.inputs.calibrate != '0' }}
        run: |
          python scripts/gated_exit.py \
            --calibrate ${{ github.event.inputs.calibrate || 10 }} \
            --out data/gated_exit_calibration.json

      - name: Test the gates on the full universe
        if: always()
        run: |
          python scripts/gated_exit.py \
            --prices data/prices.parquet \
            --out data/gated_exit_evidence.json

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "gated exit $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main || git rebase --abort || true
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, retrying ($i/3)"
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
