name: Lower-low cross-section

# The decisive test. A confirmed lower low beat random entry by +0.063R, but
# beating random entry is a low bar and the same pooled comparison once gave
# the CAPITULATION state t +6.3 before the same-day cross-section took it to
# -0.3. This asks whether the rule picks the STOCK or merely the DAY, and
# whether the stop and trail beat doing nothing at all.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lowerlow
  cancel-in-progress: false

jobs:
  lowerlow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild price panel if absent
        run: |
          if [ ! -f data/prices.parquet ]; then
            python scripts/fetch_universe.py --config config/universe.yml --out data/
          fi

      - name: Stock or day?
        if: always()
        run: |
          python scripts/test_lowerlow.py \
            --prices data/prices.parquet \
            --out data/lowerlow_evidence.json

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "lower-low cross-section $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main || git rebase --abort || true
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, retrying ($i/3)"
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
