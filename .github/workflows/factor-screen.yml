name: Factor screen

# Ten candidate stock scores tested side by side on every S&P 500 stock since
# 1997 (only stocks in the index on each date): which, if any, told you in
# advance which stocks would do best? Plus GBP 10,000 in the top 20 of each,
# rebuilt yearly, after Hargreaves Lansdown costs.
# Results: docs/FACTORS.md and data/factor_screen.json

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'        # monthly, 1st at 08:00 UTC

permissions:
  contents: write

concurrency:
  group: factor-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt requests lxml pyyaml pyarrow

      - name: Rebuild price panel if absent
        run: |
          if [ ! -f data/prices.parquet ]; then
            python scripts/fetch_universe.py --config config/universe.yml --out data/
          fi

      - name: Run the factor screen
        if: always()
        run: python scripts/factor_screen.py

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # add each file on its own: one missing file must not stop the other
          for f in docs/FACTORS.md data/factor_screen.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then echo "no changes to commit"; exit 0; fi
          git commit -m "factor screen $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main || git rebase --abort || true
            if git push origin HEAD:main; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected, retrying ($i/3)"; sleep 5
          done
          echo "could not push after 3 attempts"; exit 1
