name: Factor screen

# Every candidate stock score (price-based AND company-accounts-based) tested side by side on every S&P 500 stock since
# 1997 (only stocks in the index on each date): which, if any, told you in
# advance which stocks would do best? Plus GBP 10,000 in the top 20 of each,
# rebuilt yearly, after Hargreaves Lansdown costs.
# Results: docs/FACTORS.md and data/factor_screen.json

on:
  workflow_dispatch:
    inputs:
      pot:
        description: 'Pot size in GBP (e.g. 10000 or 100000)'
        required: false
        default: '10000'
  schedule:
    - cron: '0 8 1 * *'        # monthly, 1st at 08:00 UTC

permissions:
  contents: write

concurrency:
  group: factor-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt requests lxml pyyaml pyarrow

      - name: Rebuild price panel if absent
        run: |
          if [ ! -f data/prices.parquet ]; then
            python scripts/fetch_universe.py --config config/universe.yml --out data/
          fi

      - name: Fetch company accounts from SEC EDGAR (first run, or if missing)
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || secrets.SEC_USER_AGENT }}
        run: |
          if [ ! -f data/fundamentals.parquet ]; then
            python scripts/fetch_fundamentals.py || echo "accounts fetch failed - price-only scores will still run"
          fi

      - name: Run the factor screen
        if: always()
        env:
          POT_GBP: ${{ github.event.inputs.pot || '10000' }}
        run: python scripts/factor_screen.py

      - name: Commit
        if: always()
        run: |
          bash scripts/commit_push.sh "factor screen $(date -u +%Y-%m-%d)" \
            docs/FACTORS*.md data/factor_screen*.json data/fundamentals.parquet data/fundamentals_manifest.json
