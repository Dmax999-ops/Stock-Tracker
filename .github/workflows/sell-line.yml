name: Sell-line test

# Where should the sell line sit: bottom 25%, 33%, 50% (current), 66% or 75%?
# Full history. Results: docs/SELL_LINE.md

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sell-line
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt requests lxml pyyaml pyarrow

      - name: Rebuild price panel if absent
        run: |
          if [ ! -f data/prices.parquet ]; then
            python scripts/fetch_universe.py --config config/universe.yml --out data/
          fi

      - name: Run the test
        env:
          POT_GBP: '10000'
          BROKER: t212
        run: python scripts/sell_line_test.py

      - name: Commit
        if: always()
        run: |
          bash scripts/commit_push.sh "sell-line test $(date -u +%Y-%m-%d)" \
            docs/SELL_LINE.md data/sell_line.json
