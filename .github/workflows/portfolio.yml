name: Portfolio simulation

# What would GBP 10,000 have become? Every arm is run many times, because the
# tie-break alone moves the final balance by tens of per cent, and is compared
# with a null that buys on the SAME DAYS in randomly chosen stocks.
#
# Run the calibration job first. It reports how often the whole procedure
# declares a discovery on pure random walks. If that number is not near zero,
# nothing the simulation says can be believed.

on:
  workflow_dispatch:
    inputs:
      calibrate:
        description: 'Random-walk panels for the false-positive check (0 to skip)'
        required: false
        default: '12'
      slots:
        description: 'Maximum concurrent positions'
        required: false
        default: '12'
      draws:
        description: 'Independent draws per arm'
        required: false
        default: '40'

permissions:
  contents: write

concurrency:
  group: portfolio
  cancel-in-progress: false

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild price panel if absent
        run: |
          if [ ! -f data/prices.parquet ]; then
            python scripts/fetch_universe.py --config config/universe.yml --out data/
          fi

      # FIRST: does the procedure certify noise?
      - name: Calibrate the procedure against random walks
        if: ${{ github.event.inputs.calibrate != '0' }}
        run: |
          python scripts/portfolio_sim.py \
            --calibrate ${{ github.event.inputs.calibrate || 12 }} \
            --draws 20 --slots ${{ github.event.inputs.slots || 12 }} \
            --out data/portfolio_calibration.json

      - name: Simulate
        if: always()
        run: |
          python scripts/portfolio_sim.py \
            --prices data/prices.parquet \
            --slots ${{ github.event.inputs.slots || 12 }} \
            --draws ${{ github.event.inputs.draws || 40 }} \
            --out data/portfolio_evidence.json

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "portfolio simulation $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main || git rebase --abort || true
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, retrying ($i/3)"
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
