name: Technical setups

# Trade-level testing: entries, stops, trails, costs, and a random-entry control.
# Separate from the earnings workflow because it answers a different question and
# takes a lot longer.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 1 * *'        # monthly, on the 1st

permissions:
  contents: write

concurrency:
  group: setups
  cancel-in-progress: false

jobs:
  setups:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild price panel if absent
        run: |
          if [ ! -f data/prices.parquet ]; then
            python scripts/fetch_universe.py --config config/universe.yml --out data/
          fi

      - name: Test the setups
        if: always()
        run: |
          python scripts/test_setups.py \
            --prices data/prices.parquet \
            --out data/setup_evidence.json

      # If the exits carry the strategy, are the exits tunable? Fit on 2004-2014,
      # measure on 2015-2026, and report whether the ranking survived at all.
      - name: Exit policy study
        if: always()
        run: |
          python scripts/test_exits.py \
            --prices data/prices.parquet \
            --out data/exit_evidence.json

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "setup evidence $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main || git rebase --abort || true
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, retrying ($i/3)"
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
